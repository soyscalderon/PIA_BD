<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce - Clientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Navbar -->
  <nav class="bg-indigo-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-gamepad text-2xl text-indigo-400"></i>
        <span class="font-bold text-xl tracking-wider">GAMESTORE</span>
      </div>
      <div class="flex space-x-6 font-medium">
        <a href="index.html" class="hover:text-indigo-300 transition">Inventario</a>
        <a href="clientes.html" class="text-indigo-400 border-b-2 border-indigo-400 pb-1">Clientes</a>
        <a href="ventas.html" class="hover:text-indigo-300 transition">Ventas</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Directorio de Clientes</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center justify-between">
          <span class="flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-indigo-600"></i> <span id="titulo-form-cliente">Registrar Cliente</span>
          </span>
          <button type="button" onclick="cancelarEdicionCliente()" id="btn-cancelar-cliente" class="hidden text-xs text-rose-500 hover:underline">
            Cancelar edición
          </button>
        </h2>
        <form id="form-cliente" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo</label>
            <input type="text" id="cli_nombre" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
            <input type="email" id="cli_email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Dirección de Envío</label>
            <input type="text" id="cli_direccion" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
          </div>
          <button type="submit" id="btn-guardar-cliente" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md text-sm">
            Guardar Cliente (SP)
          </button>
        </form>
      </div>

      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-600"></i> Clientes Registrados
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase tracking-wider">
                <th class="pb-3">ID</th>
                <th class="pb-3">Nombre</th>
                <th class="pb-3">Email</th>
                <th class="pb-3">Dirección</th>
                <th class="pb-3 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-clientes" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce - Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Navbar -->
  <nav class="bg-indigo-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-gamepad text-2xl text-indigo-400"></i>
        <span class="font-bold text-xl tracking-wider">GAMESTORE</span>
      </div>
      <div class="flex space-x-6 font-medium">
        <a href="index.html" class="hover:text-indigo-300 transition">Inventario</a>
        <a href="clientes.html" class="hover:text-indigo-300 transition">Clientes</a>
        <a href="ventas.html" class="text-indigo-400 border-b-2 border-indigo-400 pb-1">Ventas</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900">Procesar Venta</h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Formulario Venta -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-emerald-600"></i> Nueva Orden de Compra
        </h2>
        <form id="form-venta" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Cliente</label>
            <select id="ven_cliente" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Juego</label>
            <select id="ven_juego" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Cantidad de Unidades</label>
            <input type="number" id="ven_cantidad" min="1" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md text-sm">
            Procesar Venta (Stored Procedure)
          </button>
        </form>
      </div>

      <!-- Historial de Pedidos -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-indigo-600"></i> Historial de Transacciones
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase tracking-wider">
                <th class="pb-3">Orden</th>
                <th class="pb-3">Cliente</th>
                <th class="pb-3">Videojuego</th>
                <th class="pb-3">Cant.</th>
                <th class="pb-3">Total</th>
                <th class="pb-3">Fecha</th>
              </tr>
            </thead>
            <tbody id="tabla-ventas" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/ventas.js"></script>
</body>
</html>
